# J5 Droidian NAS - share on the SD card (/srv/nas)
[global]
   workgroup = WORKGROUP
   netbios name = J5NAS
   server string = J5 Droidian NAS
   server role = standalone server
   # not reachable over mobile data: rmnet* is blocked by j5-nas-firewall
   map to guest = Bad User
   guest account = nobody
   log file = /var/log/samba/log.%m
   max log size = 200
   logging = file
   disable spoolss = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   use sendfile = yes

[nas]
   comment = SD card
   path = /srv/nas
   browseable = yes
   guest ok = yes
   read only = yes
   write list = nas
   force user = nas
   force group = nas
   create mask = 0664
   directory mask = 2775
   veto files = /lost+found/
